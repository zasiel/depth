<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depth Window – 2D to 3D prototype</title>
<style>
  :root { --bg: rgba(18,18,24,.88); --line: #2c2c38; --muted: #9a98a6; --text: #ecebf1; --accent: #6b57c8; }
  html, body { margin: 0; height: 100%; background: #0b0b0f; color: var(--text); font: 13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #panel { position: fixed; left: 12px; top: 12px; bottom: 12px; width: 300px; max-width: calc(100vw - 24px); background: var(--bg); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
  #head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
  #head h1 { font-size: 15px; margin: 0; flex: 1; letter-spacing: .2px; }
  #collapse { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 2px 8px; cursor: pointer; }
  #status { color: var(--muted); font-size: 12px; padding: 0 14px 8px; }
  #scroll { overflow-y: auto; padding: 0 14px 14px; flex: 1; }
  #thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
  #thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; cursor: pointer; opacity: .65; border: 2px solid transparent; box-sizing: border-box; }
  #thumbs img.on { opacity: 1; border-color: var(--accent); }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .row label { width: 70px; color: #c4c2cf; }
  .row input[type=range] { flex: 1; accent-color: var(--accent); }
  .row output { width: 46px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
  button.b, select { background: #262632; color: var(--text); border: 1px solid #3a3a48; border-radius: 8px; padding: 5px 9px; font: inherit; cursor: pointer; }
  button.b:hover { background: #31313f; }
  #mode { width: 100%; padding: 8px; background: #3b2f6b; border-color: #5a48a0; font-weight: 600; }
  #mode.alt { background: #5b3030; border-color: #8a4a4a; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; color: #c4c2cf; }
  .checks input { accent-color: var(--accent); }
  .exgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .nav { display: flex; gap: 6px; margin-top: 10px; } .nav button { flex: 1; }
  .hint { color: #8d8b99; font-size: 12px; display: block; margin-top: 4px; }
  #xrHolder { margin-top: 12px; }
  #xrHolder button, #xrHolder a { width: 100% !important; padding: 9px !important; border-radius: 9px !important; background: #1f5f4a !important; border: 1px solid #2d8a6b !important; color: #fff !important; font: 600 13px system-ui !important; opacity: 1 !important; }
  #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); background: var(--bg); border: 1px solid var(--line); padding: 8px 14px; border-radius: 10px; opacity: 0; transition: .25s; pointer-events: none; }
  #toast.on { opacity: 1; transform: translateX(-50%); }
  body.mini #scroll, body.mini #status { display: none; } body.mini #panel { bottom: auto; }
  body.xr #panel { display: none; }
  @media (max-width: 640px) { #panel { top: auto; height: 46vh; left: 8px; right: 8px; width: auto; } }
</style>
</head>
<body>
<div id="stage"></div>
<div id="panel">
  <div id="head"><h1>Depth Window</h1><button id="collapse" title="Collapse panel">☰</button></div>
  <div id="status">Loading…</div>
  <div id="scroll">
    <div id="thumbs"></div>
    <button id="mode" class="b" title="Space">Layered (ours)</button>
    <span class="hint">Move the pointer over the photo to lean. Click the photo to set focus there.</span>

    <h2>3D</h2>
    <div class="row"><label for="strength">Depth</label><input id="strength" type="range" min="0.1" max="0.95" step="0.01"><output id="strengthV"></output></div>
    <div class="row"><label for="pop">Pop-out</label><input id="pop" type="range" min="-0.5" max="0.5" step="0.01"><output id="popV"></output></div>
    <div class="row"><label>Focus</label><span style="flex:1;color:#c4c2cf">click photo to set</span><output id="focusV"></output><button id="focusAuto" class="b" title="Back to automatic focus">Auto</button></div>

    <h2>View</h2>
    <div class="row"><label for="size">Size</label><input id="size" type="range" min="0.4" max="4" step="0.05"><output id="sizeV"></output></div>
    <div class="row"><label for="distance">Distance</label><input id="distance" type="range" min="0.8" max="5" step="0.1"><output id="distanceV"></output></div>
    <div class="row"><label>Rotate</label><button id="rotL" class="b" title="Rotate left">⟲ 90°</button><button id="rotR" class="b" title="Rotate right (R)">⟳ 90°</button><output id="rollV"></output></div>
    <div class="row"><label for="tilt">Tilt</label><input id="tilt" type="range" min="-35" max="35" step="1"><output id="tiltV"></output></div>
    <div class="row"><label for="turn">Turn</label><input id="turn" type="range" min="-45" max="45" step="1"><output id="turnV"></output></div>

    <h2>Motion</h2>
    <div class="row"><label for="swayMode">Auto-sway</label><select id="swayMode"><option value="off">Off</option><option value="eight">Figure-8</option><option value="side">Side to side</option><option value="circle">Circle</option></select></div>
    <div class="row"><label for="swayAmt">Amount</label><input id="swayAmt" type="range" min="0.1" max="1" step="0.05"><output id="swayAmtV"></output></div>
    <div class="row"><label for="swaySpeed">Speed</label><input id="swaySpeed" type="range" min="0.3" max="2.5" step="0.1"><output id="swaySpeedV"></output></div>

    <h2>Display</h2>
    <div class="row"><label for="frameStyle">Frame</label><select id="frameStyle"><option value="none">None</option><option value="thin">Thin</option><option value="thick">Gallery</option><option value="soft">Soft edges</option></select></div>
    <div class="checks">
      <label><input id="glow" type="checkbox"> Ambient glow</label>
      <label><input id="slideshow" type="checkbox"> Slideshow</label>
      <label><input id="depthvis" type="checkbox"> Show depth</label>
    </div>
    <div class="nav"><button id="prev" class="b">◀ Prev</button><button id="reset" class="b" title="Reset this photo's settings">Reset</button><button id="next" class="b">Next ▶</button></div>
    <h2>Export</h2>
    <div class="exgrid">
      <button id="exSBS" class="b" title="Side-by-side stereo JPEG for Quest, 3D TVs and VR players">3D image (SBS)</button>
      <button id="exVid" class="b" title="6-second looping sway clip for sharing">Sway video</button>
      <button id="exAna" class="b" title="For red/cyan 3D glasses">Red/cyan 3D</button>
      <button id="exDepth" class="b" title="16-bit depth as an 8-bit grayscale PNG">Depth map</button>
    </div>
    <span id="exStatus" class="hint"></span>
    <div id="xrHolder"></div>
    <span class="hint">Headset: trigger = buttons / focus, grip = move, both grips = resize, stick = photo & depth, A/X = compare, B/Y = hide controls.</span>
  </div>
</div>
<div id="toast"></div>
<script>/*APP*/</script>
</body>
</html>
