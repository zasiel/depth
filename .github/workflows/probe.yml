name: probe
on:
  push:
    branches: ['ci/probe']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch SDK sources
        run: |
          mkdir -p logs/src sdk && cd sdk
          V=0.15.0
          for a in meta-spatial-sdk meta-spatial-sdk-toolkit meta-spatial-sdk-compose meta-spatial-sdk-vr; do
            curl -fsSL -o $a-sources.jar https://repo1.maven.org/maven2/com/meta/spatial/$a/$V/$a-$V-sources.jar || continue
            mkdir -p ../logs/src/$a && unzip -qo $a-sources.jar -d ../logs/src/$a
          done
          cd ../logs && find src -type f | wc -l > count.txt && du -sh src > size.txt
      - name: Publish logs
        if: always()
        run: |
          echo "run ${{ github.run_id }} done $(date -u)" > logs/STATUS.txt
          rm -rf /tmp/pub && mkdir /tmp/pub && cp -r logs/. /tmp/pub/
          cd /tmp/pub && git init -q -b ci-logs && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "probe2 logs ${{ github.run_id }}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin ci-logs
