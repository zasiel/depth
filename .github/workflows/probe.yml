name: probe
on:
  push:
    branches: ['ci/probe']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Fetch SDK artifacts and dump API
        continue-on-error: true
        run: |
          mkdir -p logs sdk && cd sdk
          V=0.15.0
          for a in meta-spatial-sdk meta-spatial-sdk-toolkit meta-spatial-sdk-compose meta-spatial-sdk-vr meta-spatial-sdk-isdk meta-spatial-sdk-uiset meta-spatial-sdk-core; do
            curl -fsSL -o $a.aar https://repo1.maven.org/maven2/com/meta/spatial/$a/$V/$a-$V.aar && echo "got $a.aar" || echo "no aar $a"
            curl -fsSL -o $a-sources.jar https://repo1.maven.org/maven2/com/meta/spatial/$a/$V/$a-$V-sources.jar && echo "got $a sources" || echo "no sources $a"
          done 2>&1 | tee ../logs/fetch.txt
          for f in *.aar; do d=${f%.aar}; mkdir -p x/$d; unzip -qo $f -d x/$d; done
          find x -name '*.jar' > ../logs/jars.txt
          find x -type f -not -name '*.class' | head -400 > ../logs/aar-files.txt
          # class listing
          for j in $(find x -name 'classes.jar'); do unzip -l $j | awk '{print $4}' | grep '\.class$' ; done | sort > ../logs/classes.txt
          wc -l ../logs/classes.txt
      - name: javap key classes
        continue-on-error: true
        run: |
          cd sdk
          CP=$(find x -name '*.jar' | tr '\n' ':')
          for c in $(grep -E 'runtime/(SamplerConfig|Filter|AddressMode|SceneMesh|SceneMaterial|SceneTexture|SceneObject|VertexLayout|AlphaMode|BlendMode|DepthWrite|DepthTest|SortOrder|StereoMode|MaterialSidedness|Scene|SceneMaterialAttribute|SceneMaterialDataType)(\$[A-Za-z]+)?\.class$' ../logs/classes.txt | sed 's/\.class$//' | sed 's#/#.#g'); do
            echo "=== $c"; javap -public -cp "$CP" "$c" 2>&1 | head -150
          done > ../logs/javap-runtime.txt
          for c in $(grep -E 'toolkit/(AppSystemActivity|PanelRegistration|UIPanelSettings|QuadShapeOptions|PanelStyleOptions|DpPerMeterDisplayOptions|SceneObjectSystem|Grabbable|Hittable|MeshCollision|PanelSceneObject|Transform|Visible|ReferenceSpace|Scale|Mesh|Material|Color4|PointerEvent|InputListener|Spatial)(\$[A-Za-z]+)?\.class$' ../logs/classes.txt | sed 's/\.class$//' | sed 's#/#.#g'); do
            echo "=== $c"; javap -public -cp "$CP" "$c" 2>&1 | head -120
          done > ../logs/javap-toolkit.txt
          grep -iE 'Input|Pointer|Click|Hover|Ray|Controller' ../logs/classes.txt | head -200 > ../logs/classes-input.txt
      - name: Build Meta sample to validate toolchain
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/meta-quest/Meta-Spatial-SDK-Samples /tmp/samples
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0" > logs/sdkmanager.txt 2>&1 || true
          cd /tmp/samples/MediaPlayerSample
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.configuration-cache=false > $GITHUB_WORKSPACE/logs/sample-build.txt 2>&1; echo "exit $?" >> $GITHUB_WORKSPACE/logs/sample-build.txt
          tail -n 60 $GITHUB_WORKSPACE/logs/sample-build.txt
      - name: Dump shader includes from Gradle caches
        continue-on-error: true
        run: |
          mkdir -p logs/glsl
          find ~/.gradle /tmp/samples/MediaPlayerSample -name '*.glsl' 2>/dev/null | head -100 > logs/glsl-list.txt
          # glsl may sit inside jars
          for j in $(find ~/.gradle -name '*.jar' 2>/dev/null | grep -i spatial); do
            if unzip -l $j 2>/dev/null | grep -q '\.glsl'; then echo $j >> logs/glsl-jars.txt; mkdir -p /tmp/gj && unzip -qo $j '*.glsl' -d logs/glsl 2>/dev/null; fi
          done
          while read f; do [ -f "$f" ] && cp --parents "$f" logs/glsl/ ; done < logs/glsl-list.txt
          find logs/glsl -type f | head -100 > logs/glsl-files.txt
          find ~/.gradle -iname '*spatial*' -maxdepth 8 2>/dev/null | head -60 > logs/gradle-spatial.txt
      - name: Publish logs
        if: always()
        run: |
          echo "run ${{ github.run_id }} done $(date -u)" > logs/STATUS.txt
          rm -rf /tmp/pub && mkdir /tmp/pub && cp -r logs/. /tmp/pub/
          cd /tmp/pub && git init -q -b ci-logs && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "probe logs ${{ github.run_id }}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin ci-logs
